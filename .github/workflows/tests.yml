name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The project is entirely about Windows: power commands, the tray icon
    # and autostart all rest on its system calls. Testing on Linux would
    # be self-deception.
    runs-on: windows-latest

    strategy:
      matrix:
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tests
        run: python -m unittest discover -s tests -t . -v

      - name: Compile
        run: python -m compileall -q app main.py
